[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]
extend-exclude = [
    "build",
    "dist",
]
unsafe-fixes = false
show-fixes = true

[tool.ruff.lint]
# Keep the baseline focused on syntax/style errors, undefined names, and imports.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
docstring-code-format = true
