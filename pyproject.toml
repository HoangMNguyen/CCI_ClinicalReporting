[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
extend-exclude = [
    "build",
    "dist",
    "src/cci_automation/ui_form.py",
    "src/safety_automation/ui_form.py",
    "src/peer_review_automation/PRAwindow_ui.py",
]
unsafe-fixes = false
show-fixes = true

[tool.ruff.lint]
# Keep the baseline focused on syntax/style errors, undefined names, and imports.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
docstring-code-format = true
