name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: the apt names below are 24.04's, and
        # the latest label moves to 26.04 in November 2026.
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # The PySide6 wheel bundles Qt and ICU but links against these.
      - name: Install the libraries Qt's offscreen platform needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0t64 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libx11-6 \
            libxkbcommon0

      - name: Install the locked versions
        run: python -m pip install -r requirements-lock.txt

      - name: Lint
        run: python -m ruff check src tests

      # tests/conftest.py runs Qt off-screen.
      - name: Test
        run: python -m pytest -q
        env:
          PYTHONPATH: src

  core-only:
    name: Core only, no Qt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          # Its own cache: without PySide6 it would otherwise fill the key the
          # full job needs, and the full job could never save its wheels.
          cache-dependency-path: |
            requirements-lock.txt
            requirements-core.txt

      # No Qt on purpose: this job shows the reporting core and the
      # automations' workflows run without it, so no apt step and no PySide6.
      - name: Install the core versions
        run: >-
          python -m pip install -r requirements-core.txt pytest pytest-cov
          -c requirements-lock.txt

      - name: Test
        run: python -m pytest -q tests/unit tests/integration
        env:
          PYTHONPATH: src
