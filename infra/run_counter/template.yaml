AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Silent successful-export counter for CCI Clinical Reporting

Parameters:
  CounterToken:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Bearer token provisioned to approved desktop installations

Resources:
  RunCounterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  RunCounterApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  RunCounterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: function/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          TABLE_NAME: !Ref RunCounterTable
          COUNTER_TOKEN: !Ref CounterToken
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt RunCounterTable.Arn
      Events:
        CountRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref RunCounterApi
            Path: /run
            Method: POST

Outputs:
  RunCounterUrl:
    Description: Configure this as CLINICAL_REPORTING_RUN_COUNTER_URL
    Value: !Sub "https://${RunCounterApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/run"
  RunCounterTableName:
    Description: DynamoDB table containing TOTAL and UTC daily counters
    Value: !Ref RunCounterTable
